spring:
  application:
    name: "taskManager"
  datasource:
    url: jdbc:postgresql://postgres:5432/crud_db
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: 123456
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
